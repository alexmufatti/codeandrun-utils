services:
  web:
    image: codeandrun-web:latest
    ports:
      - "3002:3000"
    labels:
      homepage.group: Services
      homepage.name: Code and Run Apps
      homepage.icon: mdi-run
      homepage.href: https://apps.codeandrun.it
      homepage.description: Utility per runner
    env_file:
      - .env.local
    restart: unless-stopped

  garmin-sync:
    image: codeandrun-garmin-sync:latest
    env_file:
      - .env.local
    volumes:
      - garmin-tokens:/data/garmin_tokens
    restart: unless-stopped

volumes:
  garmin-tokens:
